<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Panel admina</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #eef2f6;
  padding: 30px;
}

.container {
  max-width: 720px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

/* HEADER */
h2 {
  margin-bottom: 15px;
}

/* TABS */
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tab {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #e9ecef;
  font-weight: 600;
  transition: 0.2s;
}

.tab:hover {
  transform: translateY(-1px);
}

.tab.active {
  background: #111;
  color: white;
}

/* SECTIONS */
.section {
  display: none;
}

.section.active {
  display: block;
}

/* INPUTS */
input, textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  outline: none;
  font-size: 14px;
}

textarea {
  height: 180px;
  resize: vertical;
}

/* BUTTONS */
button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-1px);
}

.primary {
  background: #111;
  color: white;
}

.save {
  background: linear-gradient(135deg,#2d7cff,#1a5cff);
  color: white;
}

/* LOGIN */
.hidden { display: none; }

/* ABOUT */
#aboutPreview {
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  min-height: 120px;
  background: #fff;
  white-space: pre-wrap;
}

.blue-letter {
  color: #2d7cbe;
  font-weight: 700;
}

/* TOOLBAR */
#toolbar {
  position: fixed;
  background: #111;
  color: white;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  display: none;
  z-index: 9999;
}

/* LOGOUT */
.logout {
  margin-top: 15px;
  background: #ff4d4d;
  color: white;
}
.logout:hover {
  background: #e63b3b;
}
#about button {
  margin-top: 10px;
}

#togglePreviewBtn {
  margin-bottom: 10px;
}

#previewBox {
  margin-top: 12px;
  margin-bottom: 12px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox">
  <h2>🔐 Logowanie</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Hasło">
  <button class="primary" onclick="login()">Zaloguj</button>
</div>

<!-- PANEL -->
<div id="panelBox" class="hidden">

<h2>⚙️ Panel</h2>

<div class="tabs">
  <button class="tab active" onclick="openTab('liczby', this)">Liczby</button>
  <button class="tab" onclick="openTab('kalendarz', this)">Kalendarz</button>
  <button class="tab" onclick="openTab('tiktok', this)">TikTok</button>
  <button class="tab" onclick="openTab('about', this)">O nas</button>
</div>

<!-- LICZBY -->
<div id="liczby" class="section active">
  <input id="clients" placeholder="Zadowoleni klienci">
  <input id="fabrics" placeholder="Tkaniny">
  <input id="reviews" placeholder="Opinie">
  <button class="save" onclick="saveCategory('liczby')">Zapisz liczby</button>
</div>

<!-- KALENDARZ -->
<div id="kalendarz" class="section">
  <input id="busyDays" placeholder="np. 3,4,18">
  <button class="save" onclick="saveCategory('kalendarz')">Zapisz kalendarz</button>
</div>

<!-- TIKTOK -->
<div id="tiktok" class="section">
  <input id="t1" placeholder="Link TikTok 1">
  <input id="t2" placeholder="Link TikTok 2">
  <input id="t3" placeholder="Link TikTok 3">
  <button class="save" onclick="saveCategory('tiktok')">Zapisz TikTok</button>
</div>

<!-- ABOUT -->
<div id="about" class="section">

  <div id="toolbar">🔵 niebieski</div>

  <textarea id="aboutText"></textarea>

  <button id="togglePreviewBtn" class="primary">👁 Podgląd</button>

  <div id="previewBox" style="display:none; margin-top:10px;">
    <div id="aboutPreview"></div>
  </div>

  <button class="save" onclick="saveCategory('about')">Zapisz O nas</button>
</div>

<button class="logout" onclick="logout()">🚪 Wyloguj</button>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { getFirestore, doc, getDoc, setDoc }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBUU4jcNfegYzyQwAfdUu2mtR7tEnaVN1w",
  authDomain: "panel-wow.firebaseapp.com",
  projectId: "panel-wow"
});

const auth = getAuth();
const db = getFirestore();

/* STATE */
let state = {};
let currentTab = "liczby";
let dirty = { liczby:false, kalendarz:false, tiktok:false, about:false };

/* ELEMENTS */
const clients = document.getElementById("clients");
const fabrics = document.getElementById("fabrics");
const reviews = document.getElementById("reviews");
const busyDays = document.getElementById("busyDays");
const t1 = document.getElementById("t1");
const t2 = document.getElementById("t2");
const t3 = document.getElementById("t3");
const aboutText = document.getElementById("aboutText");
const aboutPreview = document.getElementById("aboutPreview");
const toolbar = document.getElementById("toolbar");

/* TAB SWITCH */
window.openTab = (tab, el) => {

  if (tab === currentTab) return;

  if (dirty[currentTab]) {
    const save = confirm("Masz niezapisane zmiany. Zapisać?");
    if (save) saveCategory(currentTab);
    else {
      const leave = confirm("Przejść bez zapisu?");
      if (!leave) return;
    }
  }

  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

  document.getElementById(tab).classList.add("active");
  el.classList.add("active");

  currentTab = tab;
};

/* TOOLBAR (BLUE TEXT) */
aboutText.addEventListener("mouseup", showToolbar);
aboutText.addEventListener("keyup", showToolbar);

function showToolbar() {
  const start = aboutText.selectionStart;
  const end = aboutText.selectionEnd;

  if (start === end) {
    toolbar.style.display = "none";
    return;
  }

  const rect = aboutText.getBoundingClientRect();

  toolbar.style.display = "block";
  toolbar.style.top = (rect.top - 40) + "px";
  toolbar.style.left = rect.left + "px";
}

/* INSERT BLUE */
toolbar.addEventListener("click", () => {
  const start = aboutText.selectionStart;
  const end = aboutText.selectionEnd;

  const selected = aboutText.value.substring(start, end);

  if (!selected) return;

  aboutText.setRangeText(
    `<blue>${selected}</blue>`,
    start,
    end,
    "end"
  );

  aboutText.dispatchEvent(new Event("input"));
});

/* PREVIEW */
function renderAbout() {
  aboutPreview.innerHTML = (aboutText.value || "")
    .replace(/<blue>(.*?)<\/blue>/g,'<span class="blue-letter">$1</span>');
}

aboutText.addEventListener("input", renderAbout);

/* TOGGLE PREVIEW */
const previewBox = document.getElementById("previewBox");
const toggleBtn = document.getElementById("togglePreviewBtn");

toggleBtn.addEventListener("click", () => {
  const show = previewBox.style.display !== "block";
  previewBox.style.display = show ? "block" : "none";
  toggleBtn.textContent = show ? "🙈 Ukryj podgląd" : "👁 Podgląd";
});

/* DIRTY TRACKING */
[clients,fabrics,reviews,busyDays,t1,t2,t3,aboutText].forEach(el=>{
  el.addEventListener("input", ()=> dirty[currentTab]=true);
});

/* LOAD */
async function loadData() {
  const snap = await getDoc(doc(db, "settings", "main"));
  state = snap.data() || {};

  clients.value = state.clients || "";
  fabrics.value = state.fabrics || "";
  reviews.value = state.reviews || "";
  busyDays.value = state.busyDays || "";

  t1.value = state.tiktok1 || "";
  t2.value = state.tiktok2 || "";
  t3.value = state.tiktok3 || "";

  aboutText.value = state.aboutText || "";

  renderAbout();
}

/* SAVE */
window.saveCategory = async (cat) => {

  const ok = confirm("Czy na pewno zatwierdzić zmiany?");
  if (!ok) return;

  if (cat === "liczby") {
    state.clients = Number(clients.value);
    state.fabrics = Number(fabrics.value);
    state.reviews = Number(reviews.value);
  }

  if (cat === "kalendarz") {
    state.busyDays = busyDays.value;
  }

  if (cat === "tiktok") {
    state.tiktok1 = t1.value;
    state.tiktok2 = t2.value;
    state.tiktok3 = t3.value;
  }

  if (cat === "about") {
    state.aboutText = aboutText.value;
  }

  await setDoc(doc(db, "settings", "main"), state);

  dirty[cat] = false;
  alert("Zapisano!");
};

/* LOGIN */
window.login = async () => {
  await setPersistence(auth, browserLocalPersistence);
  await signInWithEmailAndPassword(auth, email.value, password.value);

  loginBox.classList.add("hidden");
  panelBox.classList.remove("hidden");

  loadData();
};

onAuthStateChanged(auth, (user)=>{
  if(user){
    loginBox.classList.add("hidden");
    panelBox.classList.remove("hidden");
    loadData();
  } else {
    loginBox.classList.remove("hidden");
    panelBox.classList.add("hidden");
  }
});

/* LOGOUT */
window.logout = async () => {
  await signOut(auth);
};
</script>

</body>
</html>
