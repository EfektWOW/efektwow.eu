<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Panel admina</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 30px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h2 {
  margin-top: 0;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

textarea {
  height: 200px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 12px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 5px;
}

button:hover {
  background: #333;
}

.hidden {
  display: none;
}

/* PODGLĄD */
#aboutPreview {
  font-family: 'Poppins', sans-serif;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  min-height: 120px;
  margin-bottom: 15px;
  background: #fff;
    white-space: pre-wrap;
}

/* NIEBIESKA LITERKA */
.blue-letter {
  color: #2d7cbe;
  font-size: 1.3em;
  font-weight: 700;
}
#toolbar {
  position: absolute;
  background: rgb(24, 24, 24);
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  z-index: 9999;
  user-select: none;
}
#aboutText {
  font-family: 'Poppins', sans-serif;
}
#previewBox {
  margin-top: 10px;
}
</style>

</head>
<body>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>🔐 Logowanie</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Hasło">
    <button onclick="login()">Zaloguj</button>
  </div>

  <!-- PANEL -->
  <div id="panelBox" class="hidden">
    <h2>⚙️ Panel strony</h2>

    <h3>Liczby</h3>
    <input id="clients" placeholder="Zadowoleni klienci">
    <input id="fabrics" placeholder="Tkaniny">
    <input id="reviews" placeholder="Opinie">

    <h3>Kalendarz</h3>
    <input id="busyDays" placeholder="np. 3,4,18">

    <h3>TikTok</h3>
    <input id="t1" placeholder="Link TikTok 1">
    <input id="t2" placeholder="Link TikTok 2">
    <input id="t3" placeholder="Link TikTok 3">

    <h3>O nas</h3>
    <div id="toolbar" style="display:none;">🔵 niebieski</div>
    <textarea id="aboutText" spellcheck="false" placeholder="Tekst O NAS"></textarea>

<button id="togglePreviewBtn" type="button">
  👁 Pokaż podgląd tekstu
</button>

<div id="previewBox" style="display:none;">
  <h4>Podgląd:</h4>
  <div id="aboutPreview"></div>
</div>

    <button onclick="save()">💾 Zapisz zmiany</button>
    <button onclick="logout()">🚪 Wyloguj</button>
  </div>

</div>

<script>
  
  const togglePreviewBtn = document.getElementById("togglePreviewBtn");
const previewBox = document.getElementById("previewBox");

togglePreviewBtn.addEventListener("click", () => {
  const isHidden = previewBox.style.display === "none";

  previewBox.style.display = isHidden ? "block" : "none";

  togglePreviewBtn.textContent = isHidden
    ? "🙈 Ukryj podgląd tekstu"
    : "👁 Pokaż podgląd tekstu";
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBUU4jcNfegYzyQwAfdUu2mtR7tEnaVN1w",
  authDomain: "panel-wow.firebaseapp.com",
  projectId: "panel-wow"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

/* ================= ELEMENTY DOM ================= */

const toolbar = document.getElementById("toolbar");

const email = document.getElementById("email");
const password = document.getElementById("password");

const clients = document.getElementById("clients");
const fabrics = document.getElementById("fabrics");
const reviews = document.getElementById("reviews");
const busyDays = document.getElementById("busyDays");

const t1 = document.getElementById("t1");
const t2 = document.getElementById("t2");
const t3 = document.getElementById("t3");

const aboutText = document.getElementById("aboutText");
function updateToolbar() {
  const start = aboutText.selectionStart;
  const end = aboutText.selectionEnd;

  // nic nie zaznaczone → chowamy
  if (start === end) {
    toolbar.style.display = "none";
    return;
  }

  const rect = aboutText.getBoundingClientRect();

  toolbar.style.display = "block";

  // NAD textarea
  toolbar.style.position = "fixed";
  toolbar.style.top = (rect.top - 35) + "px";
  toolbar.style.left = rect.left + "px";
}

aboutText.addEventListener("mouseup", updateToolbar);
aboutText.addEventListener("keyup", updateToolbar);
const aboutPreview = document.getElementById("aboutPreview");

toolbar.addEventListener("click", () => {
  const start = aboutText.selectionStart;
  const end = aboutText.selectionEnd;

  const value = aboutText.value;

  const selected = value.substring(start, end);

aboutText.setRangeText(
  "<blue>" + aboutText.value.substring(start, end) + "</blue>",
  start,
  end,
  "end"
);

aboutText.dispatchEvent(new Event("input"));
});

/* ================= PODGLĄD ================= */

function renderAbout(text) {
  if (!text) return "";

  return text.replace(
    /<blue>(.*?)<\/blue>/g,
    '<span class="blue-letter">$1</span>'
  );
}

/* LIVE PREVIEW */
aboutText.addEventListener("input", () => {
  aboutPreview.innerHTML = renderAbout(aboutText.value);
});

/* ================= LOGIN ================= */

window.login = async () => {
  try {
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email.value, password.value);

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("panelBox").classList.remove("hidden");

    loadData();
  } catch (e) {
    alert("Błąd logowania");
    console.log(e);
  }
};

/* AUTO LOGIN */
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("panelBox").classList.remove("hidden");
    loadData();
  } else {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("panelBox").classList.add("hidden");
  }
});

/* ================= FIREBASE LOAD ================= */

async function loadData() {
  const snap = await getDoc(doc(db, "settings", "main"));
  const d = snap.data();
  if (!d) return;

  clients.value = d.clients || '';
  fabrics.value = d.fabrics || '';
  reviews.value = d.reviews || '';
  busyDays.value = d.busyDays || '';

  t1.value = d.tiktok1 || '';
  t2.value = d.tiktok2 || '';
  t3.value = d.tiktok3 || '';

  aboutText.value = d.aboutText || '';

  aboutPreview.innerHTML = renderAbout(d.aboutText || '');
}

/* ================= SAVE ================= */

window.save = async () => {
  await setDoc(doc(db, "settings", "main"), {
    clients: Number(clients.value),
    fabrics: Number(fabrics.value),
    reviews: Number(reviews.value),
    busyDays: busyDays.value,
    tiktok1: t1.value,
    tiktok2: t2.value,
    tiktok3: t3.value,
    aboutText: aboutText.value
  });

  alert("Zapisano!");
};

/* ================= LOGOUT ================= */

window.logout = async () => {
  await signOut(auth);
  alert("Wylogowano!");
};
</script>

</body>
</html>
