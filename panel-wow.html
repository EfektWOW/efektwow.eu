.container {

<script>
const scrollBtn = document.getElementById("scrollTopBtn");

window.addEventListener("scroll", () => {
    if (window.scrollY > 300) {
        scrollBtn.classList.add("show");
    } else {
        scrollBtn.classList.remove("show");
    }
});

scrollBtn.addEventListener("click", () => {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  writeBatch,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBUU4jcNfegYzyQwAfdUu2mtR7tEnaVN1w",
  authDomain: "panel-wow.firebaseapp.com",
  projectId: "panel-wow"
});

const auth = getAuth();
const db = getFirestore();

/* STATE */
let state = {};
let currentTab = "liczby";
let dirty = { liczby:false, kalendarz:false, tiktok:false, about:false };

/* ELEMENTS */
const clients = document.getElementById("clients");
const fabrics = document.getElementById("fabrics");
const reviews = document.getElementById("reviews");
const busyDays = document.getElementById("busyDays");
const t1 = document.getElementById("t1");
const t2 = document.getElementById("t2");
const t3 = document.getElementById("t3");
const aboutText = document.getElementById("aboutText");
const aboutPreview = document.getElementById("aboutPreview");
const toolbar = document.getElementById("toolbar");

/* TAB SWITCH */
window.openTab = (tab, el) => {

  if (tab === currentTab) return;

  if (dirty[currentTab]) {
    const save = confirm("Masz niezapisane zmiany. Zapisać?");
    if (save) saveCategory(currentTab);
    else {
      const leave = confirm("Przejść bez zapisu?");
      if (!leave) return;
    }
  }

  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

  document.getElementById(tab).classList.add("active");
  el.classList.add("active");

  currentTab = tab;
};

/* TOOLBAR (BLUE TEXT) */
aboutText.addEventListener("mouseup", showToolbar);
aboutText.addEventListener("keyup", showToolbar);

function showToolbar() {
  const start = aboutText.selectionStart;
  const end = aboutText.selectionEnd;

  if (start === end) {
    toolbar.style.display = "none";
    return;
  }

  const rect = aboutText.getBoundingClientRect();

  toolbar.style.display = "block";
  toolbar.style.top = (rect.top - 40) + "px";
  toolbar.style.left = rect.left + "px";
}

/* INSERT BLUE */
toolbar.addEventListener("click", () => {
  const start = aboutText.selectionStart;
  const end = aboutText.selectionEnd;

  const selected = aboutText.value.substring(start, end);

  if (!selected) return;

  aboutText.setRangeText(
    `<blue>${selected}</blue>`,
    start,
    end,
    "end"
  );

  aboutText.dispatchEvent(new Event("input"));
});

/* PREVIEW */
function renderAbout() {
  aboutPreview.innerHTML = (aboutText.value || "")
    .replace(/<blue>(.*?)<\/blue>/g,'<span class="blue-letter">$1</span>');
}

aboutText.addEventListener("input", renderAbout);

/* TOGGLE PREVIEW */
const previewBox = document.getElementById("previewBox");
const toggleBtn = document.getElementById("togglePreviewBtn");

toggleBtn.addEventListener("click", () => {
  const show = previewBox.style.display !== "block";
  previewBox.style.display = show ? "block" : "none";
  toggleBtn.textContent = show ? "🙈 Ukryj podgląd" : "👁 Podgląd";
});

/* DIRTY TRACKING */
[clients,fabrics,reviews,busyDays,t1,t2,t3,aboutText].forEach(el=>{
  el.addEventListener("input", ()=> dirty[currentTab]=true);
});

/* LOAD */
async function loadData() {
  const snap = await getDoc(doc(db, "settings", "main"));
  state = snap.data() || {};

  clients.value = state.clients || "";
  fabrics.value = state.fabrics || "";
  reviews.value = state.reviews || "";
  busyDays.value = state.busyDays || "";

  t1.value = state.tiktok1 || "";
  t2.value = state.tiktok2 || "";
  t3.value = state.tiktok3 || "";

  aboutText.value = state.aboutText || "";

  renderAbout();
}

async function loadReviews() {
  const box = document.getElementById("reviewsList");
  if (!box) return;
  box.innerHTML = "";

  const snap = await getDocs(collection(db, "reviews"));

const docsArray = [];
snap.forEach((docSnap) => {
  docsArray.push({ id: docSnap.id, data: docSnap.data() });
});

// sortowanie po dacie DD.MM.YYYY od najnowszej
docsArray.sort((a, b) => {
  function parseDate(str) {
    if (!str) return 0;
    const [d, m, y] = str.split('.');
    return new Date(y, m - 1, d).getTime();
  }
  return parseDate(b.data.date) - parseDate(a.data.date);
});

docsArray.forEach(({ id, data: r }) => {
  const stars = '★'.repeat(r.stars || 5) + '☆'.repeat(5 - (r.stars || 5));

  const initials = (r.name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  const avatarHTML = r.avatar
    ? `<img class="review-admin-avatar" src="${r.avatar}" alt="${r.name}">`
    : `<div class="review-admin-avatar-placeholder">${initials}</div>`;

  const div = document.createElement("div");
  div.className = "review-admin";

  div.innerHTML = `
    ${avatarHTML}
    <div class="review-admin-body">
      <div class="review-admin-header">
        <span class="review-admin-name">${r.name}</span>
        <span class="review-admin-date">${r.date || ""}</span>
      </div>
      <div class="review-admin-stars">${stars}</div>
      <div class="review-admin-text">${r.text}</div>
    </div>
    <div class="review-admin-actions">
      <button class="review-edit" onclick="editReview('${id}', this)" title="Edytuj">✏️</button>
      <button class="review-delete" onclick="deleteReview('${id}')" title="Usuń">✕</button>
    </div>
  `;

window.loadProjects = async () => {
  const box = document.getElementById("projectsList");
  if (!box) return;
  box.innerHTML = '<p style="color:#999;font-size:13px">Ładowanie...</p>';

  let snap;
  try {
    snap = await getDocs(collection(db, "projects"));
  } catch(err) {
    box.innerHTML = '<p style="color:#ff4d4d;font-size:13px">❌ Błąd Firestore: ' + err.message + '<br><br>Sprawdź reguły bezpieczeństwa w Firebase — kolekcja "projects" musi być dozwolona.</p>';
    return;
  }

  const arr = [];
  snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
  arr.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));

  box.innerHTML = "";

  if (arr.length === 0) {
    box.innerHTML = '<p style="color:#999;font-size:13px">Brak projektów. Dodaj pierwszy lub zaimportuj istniejące.</p>';
    return;
  }

  arr.forEach((p, idx) => {
    const div = document.createElement("div");
    div.className = "project-admin";
    div.draggable = true;
    div.dataset.id = p.id;
    div.dataset.order = p.order ?? idx;

    const shortTitle = p.title ? (p.title.length > 60 ? p.title.slice(0,60)+"…" : p.title) : "(brak opisu)";

    div.innerHTML = `
      <span class="project-admin-drag-handle" title="Przeciągnij aby zmienić kolejność">☰</span>
      <div class="project-admin-thumb">
        ${p.before ? `<img src="${p.before}" alt="przed" title="Przed">` : '<div style="width:60px;height:48px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa">brak</div>'}
        ${p.after ? `<img src="${p.after}" alt="po" title="Po">` : '<div style="width:60px;height:48px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa">brak</div>'}
      </div>
      <div class="project-admin-body">
        <div class="project-admin-order">${p.counter || ""}</div>
        <div class="project-admin-title">${shortTitle}</div>
      </div>
      <div class="project-admin-actions">
        <button class="project-edit" onclick="editProject('${p.id}')" title="Edytuj">✏️</button>
        <button class="project-delete" onclick="deleteProject('${p.id}')" title="Usuń">✕</button>
      </div>
    `;

    box.appendChild(div);
  });

  initProjectDragDrop(box);
};

function initProjectDragDrop(box) {
  let dragSrc = null;

  box.querySelectorAll(".project-admin").forEach(item => {
    item.addEventListener("dragstart", e => {
      dragSrc = item;
      item.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    item.addEventListener("dragend", () => {
      item.classList.remove("dragging");
      box.querySelectorAll(".project-admin").forEach(i => i.classList.remove("drag-over"));
      saveProjectOrder(box);
    });
    item.addEventListener("dragover", e => {
      e.preventDefault();
      if (item === dragSrc) return;
      box.querySelectorAll(".project-admin").forEach(i => i.classList.remove("drag-over"));
      item.classList.add("drag-over");
      const rect = item.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid) {
        box.insertBefore(dragSrc, item);
      } else {
        box.insertBefore(dragSrc, item.nextSibling);
      }
    });
  });
}

async function saveProjectOrder(box) {
  const items = box.querySelectorAll(".project-admin");
  const batch = writeBatch(db);
  items.forEach((item, idx) => {
    const ref = doc(db, "projects", item.dataset.id);
    batch.update(ref, { order: idx });

  });
  await batch.commit();
}

window.addProject = async () => {
  const counter = document.getElementById("pCounter").value.trim();
  const title = document.getElementById("pTitle").value.trim();
  const before = document.getElementById("pBefore").value.trim();
  const after = document.getElementById("pAfter").value.trim();

  if (!counter && !title && !before && !after) {
    alert("Uzupełnij przynajmniej etykietę, opis lub zdjęcia projektu");
    return;
  }

  const ok = confirm("Dodać projekt?");
  if (!ok) return;

  // get current max order
  const snap = await getDocs(collection(db, "projects"));
  let maxOrder = -1;
  snap.forEach(d => { const o = d.data().order ?? 0; if (o > maxOrder) maxOrder = o; });

  await addDoc(collection(db, "projects"), {
    counter,
    title,
    before,
    after,
    order: maxOrder + 1,
    createdAt: Date.now()
  });

  document.getElementById("pCounter").value = "";
  document.getElementById("pTitle").value = "";
  document.getElementById("pBefore").value = "";
  document.getElementById("pAfter").value = "";

  loadProjects();
};

  const ok = confirm("Na pewno usunąć ten projekt?");
  if (!ok) return;
  await deleteDoc(doc(db, "projects", id));
  loadProjects();
};

      <div class="edit-modal-btns">
        <button style="background:#eee;color:#111" onclick="document.getElementById('editModal').remove()">Anuluj</button>
        <button style="background:linear-gradient(135deg,#2d7cff,#1a5cff);color:white" onclick="saveEditProject('${id}')">Zapisz</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
};

window.saveEditProject = async (id) => {
  const counter = document.getElementById("epCounter").value.trim();
  const title = document.getElementById("epTitle").value.trim();
  const before = document.getElementById("epBefore").value.trim();
  const after = document.getElementById("epAfter").value.trim();

  const ok = confirm("Zapisać zmiany?");
  if (!ok) return;

  await updateDoc(doc(db, "projects", id), { counter, title, before, after, updatedAt: Date.now() });
  document.getElementById("editModal").remove();
  loadProjects();
};

window.importOldProjects = async () => {
  const ok = confirm(`Zaimportować ${OLD_PROJECTS.length} istniejących projektów do Firebase?\n\nUWAGA: kliknij ten przycisk tylko raz! Jeśli już importowałeś, anuluj.`);
  if (!ok) return;

  try {
    for (let i = 0; i < OLD_PROJECTS.length; i++) {
      const p = OLD_PROJECTS[i];
      await addDoc(collection(db, "projects"), {
        counter: "Projekt " + String(i+1).padStart(2,"0"),
        title: p.title,
        before: p.before,
        after: p.after,
        order: i,
        createdAt: Date.now()
      });
    }
  } catch(err) {
    alert("❌ Błąd podczas importu: " + err.message + "\n\nNajprawdopodobniej reguły Firebase blokują zapis do kolekcji 'projects'. Sprawdź Firestore Rules.");
    loadProjects();
    return;
  }

  // ukryj przycisk żeby nie importować dwa razy
  document.getElementById("importProjectsBtn").style.display = "none";

  alert("Import zakończony! Zaimportowano " + OLD_PROJECTS.length + " projektów.");
  loadProjects();
};

window.saveEditReview = async (id) => {
  const name   = document.getElementById('eName').value;
  const text   = document.getElementById('eText').value;
  const date   = document.getElementById('eDate').value;
  const avatar = document.getElementById('eAvatar').value;
  const stars  = Number(document.getElementById('eStars').value);

  if (!name || !text) { alert('Uzupełnij imię i treść'); return; }

  const ok = confirm('Zapisać zmiany?');
  if (!ok) return;

  await setDoc(doc(db, 'reviews', id), {
    name, text, date, avatar, stars,
    updatedAt: Date.now()
  }, { merge: true });

  document.getElementById('editModal').remove();
  loadReviews();
};
</script>

</body>
