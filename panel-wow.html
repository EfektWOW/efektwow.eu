<style>
body {
  font-family: 'Poppins', sans-serif;

  padding: 30px;
}

.container {
  max-width: 720px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.08);

/* HEADER */
h2 {

}

/* TABS */
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tab {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #e9ecef;
  font-weight: 600;
  transition: 0.2s;
}

.tab:hover {
  transform: translateY(-1px);
}

.tab.active {
  background: #111;
  color: white;
}

/* SECTIONS */
.section {
  display: none;
}

.section.active {
  display: block;
}

/* INPUTS */
input, textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  outline: none;
  font-size: 14px;

textarea {

}

/* BUTTONS */
button {

  border-radius: 10px;

  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-1px);
}

.primary {
  background: #111;
  color: white;
}

.save {
  background: linear-gradient(135deg,#2d7cff,#1a5cff);

}

/* LOGIN */
.hidden { display: none; }

/* ABOUT */
#aboutPreview {
  padding: 12px;

  border-radius: 10px;

  background: #fff;

}

.blue-letter {

/* TOOLBAR */
#toolbar {
  position: fixed;
  background: #111;

/* LOGOUT */

}
#about button {
  margin-top: 10px;
}

#togglePreviewBtn {
  margin-bottom: 10px;
}

#previewBox {
  margin-top: 12px;
  margin-bottom: 12px;
}

<script>
const scrollBtn = document.getElementById("scrollTopBtn");

window.addEventListener("scroll", () => {
    if (window.scrollY > 300) {
        scrollBtn.classList.add("show");
    } else {
        scrollBtn.classList.remove("show");
    }
});

scrollBtn.addEventListener("click", () => {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBUU4jcNfegYzyQwAfdUu2mtR7tEnaVN1w",
  authDomain: "panel-wow.firebaseapp.com",
  projectId: "panel-wow"
});

const auth = getAuth();
const db = getFirestore();

/* STATE */
let state = {};
let currentTab = "liczby";
let dirty = { liczby:false, kalendarz:false, tiktok:false, about:false };

/* ELEMENTS */
const clients = document.getElementById("clients");
const fabrics = document.getElementById("fabrics");
const reviews = document.getElementById("reviews");
const busyDays = document.getElementById("busyDays");
const t1 = document.getElementById("t1");
const t2 = document.getElementById("t2");
const t3 = document.getElementById("t3");
const aboutText = document.getElementById("aboutText");
const aboutPreview = document.getElementById("aboutPreview");
const toolbar = document.getElementById("toolbar");

/* TAB SWITCH */
window.openTab = (tab, el) => {

  if (tab === currentTab) return;

  if (dirty[currentTab]) {
    const save = confirm("Masz niezapisane zmiany. Zapisać?");
    if (save) saveCategory(currentTab);
    else {
      const leave = confirm("Przejść bez zapisu?");
      if (!leave) return;
    }
  }

  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

  document.getElementById(tab).classList.add("active");
  el.classList.add("active");

  currentTab = tab;
};

/* TOOLBAR (BLUE TEXT) */
aboutText.addEventListener("mouseup", showToolbar);
aboutText.addEventListener("keyup", showToolbar);

function showToolbar() {
  const start = aboutText.selectionStart;
  const end = aboutText.selectionEnd;

  if (start === end) {
    toolbar.style.display = "none";
    return;
  }

  const rect = aboutText.getBoundingClientRect();

  toolbar.style.display = "block";
  toolbar.style.top = (rect.top - 40) + "px";
  toolbar.style.left = rect.left + "px";
}

/* INSERT BLUE */
toolbar.addEventListener("click", () => {
  const start = aboutText.selectionStart;
  const end = aboutText.selectionEnd;

  const selected = aboutText.value.substring(start, end);

  if (!selected) return;

  aboutText.setRangeText(
    `<blue>${selected}</blue>`,
    start,
    end,
    "end"
  );

  aboutText.dispatchEvent(new Event("input"));
});

/* PREVIEW */
function renderAbout() {
  aboutPreview.innerHTML = (aboutText.value || "")
    .replace(/<blue>(.*?)<\/blue>/g,'<span class="blue-letter">$1</span>');
}

aboutText.addEventListener("input", renderAbout);

/* TOGGLE PREVIEW */
const previewBox = document.getElementById("previewBox");
const toggleBtn = document.getElementById("togglePreviewBtn");

toggleBtn.addEventListener("click", () => {
  const show = previewBox.style.display !== "block";
  previewBox.style.display = show ? "block" : "none";
  toggleBtn.textContent = show ? "🙈 Ukryj podgląd" : "👁 Podgląd";
});

/* DIRTY TRACKING */
[clients,fabrics,reviews,busyDays,t1,t2,t3,aboutText].forEach(el=>{
  el.addEventListener("input", ()=> dirty[currentTab]=true);
});

/* LOAD */
async function loadData() {
  const snap = await getDoc(doc(db, "settings", "main"));
  state = snap.data() || {};

  clients.value = state.clients || "";
  fabrics.value = state.fabrics || "";
  reviews.value = state.reviews || "";
  busyDays.value = state.busyDays || "";

  t1.value = state.tiktok1 || "";
  t2.value = state.tiktok2 || "";
  t3.value = state.tiktok3 || "";

  aboutText.value = state.aboutText || "";

  renderAbout();
}

async function loadReviews() {
  const box = document.getElementById("reviewsList");
  if (!box) return;
  box.innerHTML = "";

  const snap = await getDocs(collection(db, "reviews"));

const docsArray = [];
snap.forEach((docSnap) => {
  docsArray.push({ id: docSnap.id, data: docSnap.data() });
});

// sortowanie po dacie DD.MM.YYYY od najnowszej
docsArray.sort((a, b) => {
  function parseDate(str) {
    if (!str) return 0;
    const [d, m, y] = str.split('.');
    return new Date(y, m - 1, d).getTime();
  }
  return parseDate(b.data.date) - parseDate(a.data.date);
});

docsArray.forEach(({ id, data: r }) => {
  const stars = '★'.repeat(r.stars || 5) + '☆'.repeat(5 - (r.stars || 5));

  const initials = (r.name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  const avatarHTML = r.avatar
    ? `<img class="review-admin-avatar" src="${r.avatar}" alt="${r.name}">`
    : `<div class="review-admin-avatar-placeholder">${initials}</div>`;

  const div = document.createElement("div");
  div.className = "review-admin";

  div.innerHTML = `
    ${avatarHTML}
    <div class="review-admin-body">
      <div class="review-admin-header">
        <span class="review-admin-name">${r.name}</span>
        <span class="review-admin-date">${r.date || ""}</span>
      </div>
      <div class="review-admin-stars">${stars}</div>
      <div class="review-admin-text">${r.text}</div>
    </div>
    <div class="review-admin-actions">
      <button class="review-edit" onclick="editReview('${id}', this)" title="Edytuj">✏️</button>
      <button class="review-delete" onclick="deleteReview('${id}')" title="Usuń">✕</button>
    </div>
  `;

  box.appendChild(div);
});
}

/* SAVE */
window.saveCategory = async (cat) => {

  const ok = confirm("Czy na pewno zatwierdzić zmiany?");
  if (!ok) return;

  if (cat === "liczby") {
    state.clients = Number(clients.value);
    state.fabrics = Number(fabrics.value);
  }

  if (cat === "kalendarz") {
    state.busyDays = busyDays.value;
  }

  if (cat === "tiktok") {
    state.tiktok1 = t1.value;
    state.tiktok2 = t2.value;
    state.tiktok3 = t3.value;
  }

  if (cat === "about") {
    state.aboutText = aboutText.value;
  }

  await setDoc(doc(db, "settings", "main"), state);

  dirty[cat] = false;
  alert("Zapisano!");
};

/* LOGIN */
window.login = async () => {
  await setPersistence(auth, browserLocalPersistence);
  await signInWithEmailAndPassword(auth, email.value, password.value);

  loginBox.classList.add("hidden");
  panelBox.classList.remove("hidden");

loadData();
};

onAuthStateChanged(auth, (user)=>{
  if(user){
    loginBox.classList.add("hidden");
    panelBox.classList.remove("hidden");
    loadData();
    loadReviews();
  } else {
    loginBox.classList.remove("hidden");
    panelBox.classList.add("hidden");
  }
});

/* LOGOUT */
window.logout = async () => {
  await signOut(auth);
};

window.addReview = async () => {

  const name = document.getElementById("rName").value;
  const text = document.getElementById("rText").value;
  const date = document.getElementById("rDate").value;
  const avatar = document.getElementById("rAvatar").value;
  const stars = Number(document.getElementById("rStars").value);

  if (!name || !text) {
    alert("Uzupełnij imię i treść");
    return;
  }

  const ok = confirm("Dodać opinię?");
  if (!ok) return;

  await addDoc(collection(db, "reviews"), {
    name,
    text,
    date,
    avatar,
    stars,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });

  // czyszczenie inputów
  document.getElementById("rName").value = "";
  document.getElementById("rText").value = "";
  document.getElementById("rDate").value = "";
  document.getElementById("rAvatar").value = "";
  document.getElementById("rStars").value = 5;

  loadReviews();
};

window.deleteReview = async (id) => {

  const ok = confirm("Na pewno usunąć tę opinię?");
  if (!ok) return;

  await deleteDoc(doc(db, "reviews", id));

  loadReviews();
};

window.importOldReviews = async () => {

  const ok = confirm("Zaimportować stare opinie do Firebase?");

window.editReview = (id, btn) => {
  // znajdź kartę opinii
  const card = btn.closest('.review-admin');
  const name = card.querySelector('.review-admin-name').textContent;
  const date = card.querySelector('.review-admin-date').textContent;
  const text = card.querySelector('.review-admin-text').textContent;
  const stars = card.querySelectorAll('.review-admin-stars')[0].textContent
    .split('').filter(c => c === '★').length;
  const avatarEl = card.querySelector('.review-admin-avatar');
  const avatar = avatarEl ? avatarEl.src : '';

  // usuń poprzedni modal jeśli był
  document.getElementById('editModal')?.remove();

  // stwórz modal
  const overlay = document.createElement('div');
  overlay.className = 'edit-modal-overlay';
  overlay.id = 'editModal';

  overlay.innerHTML = `
    <div class="edit-modal">
      <h3>✏️ Edytuj opinię</h3>
      <input id="eName" value="${name}" placeholder="Imię i nazwisko">
      <textarea id="eText" placeholder="Treść opinii">${text}</textarea>
      <input id="eDate" value="${date}" placeholder="Data">
      <input id="eAvatar" value="${avatar}" placeholder="Link do avatara">
      <input id="eStars" type="number" min="1" max="5" value="${stars}">
      <div class="edit-modal-btns">
        <button style="background:#eee; color:#111"
          onclick="document.getElementById('editModal').remove()">
          Anuluj
        </button>
        <button style="background:linear-gradient(135deg,#2d7cff,#1a5cff); color:white"
          onclick="saveEditReview('${id}')">
          Zapisz
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  // zamknij klikając poza modalem
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });
};

window.saveEditReview = async (id) => {
  const name   = document.getElementById('eName').value;
  const text   = document.getElementById('eText').value;
  const date   = document.getElementById('eDate').value;
  const avatar = document.getElementById('eAvatar').value;
  const stars  = Number(document.getElementById('eStars').value);

  if (!name || !text) { alert('Uzupełnij imię i treść'); return; }

  const ok = confirm('Zapisać zmiany?');
  if (!ok) return;

  await setDoc(doc(db, 'reviews', id), {
    name, text, date, avatar, stars,
    updatedAt: Date.now()
  }, { merge: true });

  document.getElementById('editModal').remove();
  loadReviews();
};
</script>
